apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinique-frontend
  namespace: clinique
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinique-frontend
  template:
    metadata:
      labels:
        app: clinique-frontend
    spec:
      containers:
        - name: frontend
          image: khaoulachaouaty/clinique-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
