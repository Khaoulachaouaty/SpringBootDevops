apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: clinique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinique-secrets
                  key: grafana-admin-password
            - name: GF_DATASOURCES_DEFAULT_TYPE
              value: prometheus
            - name: GF_DATASOURCES_DEFAULT_URL
              value: http://prometheus:9090
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
