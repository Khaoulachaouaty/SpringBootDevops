spring.application.name=Clinique

# Database — env vars override for Docker/K8s
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clinique_DB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

server.servlet.context-path=/clinique
server.port=8082

# WebSocket
spring.websocket.support=true

# Actuator — expose health + prometheus for monitoring
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
